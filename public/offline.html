<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14244a">
  <title>No internet · DSC Interior</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #14244a; color: #faf6ee; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    main { max-width: 360px; }
    .logo { width: 84px; height: 84px; margin: 0 auto 20px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin: 0 0 8px; line-height: 1.5; opacity: .9; }
    .hi { opacity: .75; font-size: 15px; }
    button { margin-top: 20px; width: 100%; border: 0; border-radius: 12px; padding: 16px; font-size: 18px; font-weight: 600; background: #c8872e; color: #14244a; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/icons/icon-192.png" alt="DSC">
    <h1>No internet connection</h1>
    <p>Your work is safe. Move to a place with signal, then try again.</p>
    <p class="hi">Internet nahi hai. Signal wali jagah jaakar phir se try karein.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
